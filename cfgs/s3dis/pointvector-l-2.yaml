    - PointsToTensor
    - PointCloudScaling
    - PointCloudXYZAlign
    - PointCloudRotation
    - PointCloudJitter
    - ChromaticDropGPU
    - ChromaticNormalize

  val:
    - PointsToTensor
    - PointCloudXYZAlign
    - ChromaticNormalize

  vote:
    - ChromaticDropGPU

deterministic: false
dist_backend: nccl
dist_url: tcp://localhost:8888
distributed: false
epoch: 0
epochs: 100

